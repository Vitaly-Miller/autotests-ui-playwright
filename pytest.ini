# Pytest configuration file
[pytest]

#=================================================== Run flags =========================================================
# Flags added automatically when running tests (pytest ↲)
# -s - enables console output
# -v - increases verbosity (verbose)
# -k - filter by name (keyword) (e.g.: -k "login")
# -m - filter by marker (e.g.: -m "smoke")

addopts = -s -v

# With Allure report saving (cleaned before each run)
#addopts = -s -v --alluredir=./allure-results --clean-alluredir

#=================================================== Find test =========================================================
# Test files (default - <test_*.py *_test.py>)
python_files = test_*.py

# Test classes (default)
python_classes = Test*

# Test functions (methods) (default)
python_functions = test_*


#=================================================== Markers ===========================================================
# Custom markers (⚠️to avoid <PytestUnknownMarkWarning ========= warnings summary ========>)
markers =
    smoke:         Smoke tests
    regression:    Regression tests
    negative:      Negative tests
    e2e:           End-to-end tests
    ui:            UI tests

    auth:          Tests related to user authorization
    login:         Tests related to Login page
    registration:  Tests related to Registration page
    dashboard:     Tests related to Dashboard page
    courses:       Tests related to Courses list page
    create_course: Tests related to Create course page
    exercises:     Tests related to exercises

    files:         Tests related to files (Load/Upload)

#=================================================== Logging ===========================================================
# Format of records pytest captures from logging (these are what Allure attaches to the report - log section)
log_format =  %(levelname)s | %(name)s: %(message)s

#=======================================================================================================================
