# Workflow
name: UI tests

# Events
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Jobs
jobs:
  #================================================== Job 1: Tests =====================================================
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone
      - name: Check out repository
        uses: actions/checkout@v7                                    # https://github.com/actions/checkout

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v6                                # https://github.com/actions/setup-python
        with:
          python-version: '3.13'
          cache: pip

      # 3. Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # 4. Run tests + generate Allure results
      - name: Run Playwright tests with pytest and generate Allure results
        env:
          HEADLESS: "true"
          SLOW_MO: "0"
        run: pytest --alluredir=allure-results --numprocesses 2    # Worker processes (parallel)

      # 5. Artefacts
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7                           # https://github.com/actions/upload-artifact
        with:
          name: allure-results
          path: allure-results


  #================================================= Job 2: Publish report =============================================
  publish-report:
    needs: [ run-tests ]                                           # Job is launched after run-tests are completed only
    if: always()
    runs-on: ubuntu-latest

    steps:
      # 1. Allure history
      - name: Get Allure history
        uses: actions/checkout@v7                                  # https://github.com/actions/checkout
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 2. Artifacts downloading
      - name: Download Allure results
        uses: actions/download-artifact@v8                         # https://github.com/actions/download-artifact
        with:
          name: allure-results
          path: allure-results

      # 3. Allure report generation
      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@master               # https://github.com/simple-elf/allure-report-action
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 4. Safety step: Remove any possible broken .git inside allure-history
      - name: Clean stray .git from publish dir
        run: sudo rm -rf allure-history/.git

      # 5. Deploy Allure result
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4                        # https://github.com/peaceiris/actions-gh-pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

#=======================================================================================================================
